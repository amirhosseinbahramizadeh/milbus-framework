[workspace]
resolver = "2"
members = [
    "crates/protocol-core",
    "crates/simulator",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Local crates
protocol-core = { path = "crates/protocol-core" }
simulator = { path = "crates/simulator" }
tui = { path = "crates/tui" }

# Protocol crates
mil_std_1553b = "0.5"
arinc429 = "0.1"

# UI / utilities
ratatui = "0.30"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Observability / configuration / benchmarking
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
criterion = { version = "0.5", features = ["async_tokio"] }
toml = "0.8"
serde_yaml = "0.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
